[workspace]
name = "individual_training"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
mermaid-cli = ">=11.17.0,<12"

[tasks.clean]
cmd = "rm *.svg *.png"

[tasks.browser]
cmd = "$CONDA_PREFIX/lib/node_modules/@mermaid-js/mermaid-cli/node_modules/.bin/puppeteer browsers install chrome-headless-shell"

[tasks.diagrams]
depends-on = ["browser"]
cmd = "bash -ec 'for f in *.mmd; do mmdc -i \"$f\" -o \"${f%.mmd}.svg\"; mmdc -i \"$f\" -o \"${f%.mmd}.png\" -s 2; done'"
inputs = ["*.mmd"]
outputs = ["*.svg", "*.png"]
